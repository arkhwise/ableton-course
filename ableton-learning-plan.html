<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ableton Live Learning Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Session-View style clip grid summarises progress in a sticky rail; the plan reads in one column beside it. */
:root {
  --bg: #eceef1;
  --surface: #ffffff;
  --sunk: #e2e5ea;
  --ink: #15181d;
  --muted: #5a6370;
  --line: #d3d8df;
  --focus: #2f66d6;
  --done: #2e8f5e;
  --l1: #e3a033; --l2: #3fa79b; --l3: #6f81ea; --l4: #cf5fa8; --l5: #7fb23c; --l6: #e0583f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d22; --sunk: #23272e; --ink: #e8ebef; --muted: #98a2ae;
    --line: #2d323a; --focus: #7aa2ff; --done: #4fbf86; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d22; --sunk: #23272e; --ink: #e8ebef; --muted: #98a2ae;
  --line: #2d323a; --focus: #7aa2ff; --done: #4fbf86; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; }
@media (max-width: 920px) { .app { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 16px 48px; } }

/* Rail */
.rail { position: sticky; top: 16px; align-self: start; display: grid; gap: 18px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 4px; }
@media (max-width: 920px) { .rail { position: static; max-height: none; overflow: visible; } .nav { display: none; } }
.brand h1 { font-size: 26px; letter-spacing: -0.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.overall { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.overall .big { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; }
.overall .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--c, var(--ink)); transition: width .3s ease; }
.small { font-size: 12.5px; color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.session { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.session .col { display: grid; gap: 5px; align-content: start; }
.session .head { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: center; padding-bottom: 2px; border-bottom: 3px solid var(--c); }
.slot { position: relative; height: 26px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; cursor: pointer; padding: 0; font: 500 10px/1 var(--mono); color: var(--muted); }
.slot > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c); opacity: .9; transition: width .3s ease; }
.slot > span { position: relative; }
.slot.full > span { color: #fff; }
.slot.now { box-shadow: 0 0 0 2px var(--ink); }
.slot:hover { border-color: var(--muted); }

.nav { display: grid; gap: 2px; }
.nav a { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--sunk); }
.nav .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--muted)); }
.nav .pct { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 6px; }
button.btn, label.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: 600 12.5px/1.2 var(--body); cursor: pointer; }
button.btn:hover, label.btn:hover { border-color: var(--muted); }
button.btn.danger { color: #c2412d; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; }
.toast { font-size: 12.5px; color: var(--done); min-height: 1em; }

/* Main */
main { min-width: 0; display: grid; gap: 28px; }
.now-card { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.now-card h2 { font-size: 22px; }
.now-card .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.now-card button { background: var(--bg); color: var(--ink); border: 0; border-radius: 6px; padding: 9px 14px; font: 600 13.5px var(--body); cursor: pointer; }

section.block { display: grid; gap: 14px; scroll-margin-top: 16px; }
.sec-head { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.sec-head h2 { font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.01em; }
.sec-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip.clip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.sec-head .bar { flex: 1 1 140px; max-width: 260px; }

.prose { max-width: 70ch; display: grid; gap: 10px; }
.prose p { margin: 0; }
.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
ul.links, ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
ul.links li::marker { color: var(--c, var(--muted)); }

details.week { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px; }
details.week > summary::-webkit-details-marker { display: none; }
details.week > summary h3 { font-size: 17px; font-weight: 600; }
details.week .wk { font: 500 12px/1 var(--mono); padding: 6px 7px; border-radius: 4px; background: var(--c); color: #fff; min-width: 46px; text-align: center; }
details.week .count { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
details.week .count .bar { width: 64px; }
details.week.complete .wk { background: var(--done); }
details.week[open] > summary { border-bottom: 1px solid var(--line); }
details.week .body { padding: 6px 16px 18px; display: grid; gap: 10px; }
details.week.now { box-shadow: 0 0 0 2px var(--c); }
.caret { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; margin-left: 4px; }
details[open] .caret { transform: rotate(-135deg); }
@media (max-width: 520px) { details.week .count .bar { display: none; } }

ul.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.tasks li label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
ul.tasks li label:hover { background: var(--sunk); }
ul.tasks input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--done); cursor: pointer; }
ul.tasks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }

.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.video { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); min-width: 0; }
.video.playing { grid-column: 1 / -1; }
.thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 0; padding: 0; background: #000; cursor: pointer; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease, opacity .25s; opacity: .92; }
.thumb:hover img { transform: scale(1.03); opacity: 1; }
.thumb .play { position: absolute; left: 50%; top: 50%; width: 52px; height: 36px; transform: translate(-50%, -50%); border-radius: 9px; background: rgba(0,0,0,.72); }
.thumb .play::after { content: ""; position: absolute; left: 21px; top: 10px; border-left: 14px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
.thumb.fallback { background: linear-gradient(135deg, var(--c), #20242b); }
.video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 0; background: #000; }
.vinfo { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.vinfo .vt { font-weight: 600; font-size: 14px; line-height: 1.35; }
.vinfo .vm { font-size: 12.5px; color: var(--muted); }
.vrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.vrow label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.vrow input { accent-color: var(--done); width: 15px; height: 15px; margin: 0; }
.vrow a { font-size: 12.5px; }
.video.watched .thumb img { opacity: .45; }
.video.watched .vt::after { content: " · watched"; font: 500 11px var(--mono); color: var(--done); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { font: 500 11.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td a[data-yt]::before { content: "▶ "; font-size: 10px; color: var(--c, var(--muted)); }

.grid16 { border-collapse: separate; border-spacing: 4px; width: auto; }
.grid16 th, .grid16 td { border: 0; padding: 0; background: none; }
.grid16 th { text-align: center; font-size: 10.5px; padding-bottom: 2px; }
.grid16 th.beat { color: var(--ink); }
.grid16 td.name { font: 500 12px var(--mono); padding-right: 10px; white-space: nowrap; color: var(--muted); }
.pad { display: block; width: 26px; height: 26px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); }
.pad.beatcol { border-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.pad.on { background: var(--c); border-color: var(--c); }
.pad.opt { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--c) 55%, transparent) 0 3px, transparent 3px 6px); border-color: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend .pad { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }

.status { font: 500 11.5px var(--mono); padding: 3px 7px; border-radius: 4px; white-space: nowrap; }
.status.s0 { background: var(--sunk); color: var(--muted); }
.status.s1 { background: color-mix(in srgb, var(--l1) 22%, transparent); color: var(--ink); }
.status.s2 { background: color-mix(in srgb, var(--done) 22%, transparent); color: var(--ink); }

.sub-head { font-size: 18px; margin-top: 8px; }
.appendix-sub { display: grid; gap: 10px; }
footer { color: var(--muted); font-size: 12.5px; max-width: 70ch; border-top: 1px solid var(--line); padding-top: 14px; }

dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 12px; width: min(960px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,12,15,.7); }
dialog .dhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; }
dialog .dhead strong { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog iframe { display: block; width: 100%; aspect-ratio: 16/9; border: 0; background: #000; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Progress">
    <div class="brand">
      <h1>Ableton Live Learning Plan</h1>
      <p>21 weeks · 16 lessons · starts Mon 9 Nov 2026</p>
    </div>
    <div class="overall">
      <div class="row"><span class="eyebrow">Course progress</span><span class="small mono" id="ov-count"></span></div>
      <div class="big mono" id="ov-pct">0%</div>
      <div class="bar" style="--c: var(--done)"><i id="ov-bar"></i></div>
      <div class="small" id="ov-videos"></div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Weeks as clips</div>
      <div class="session" id="session"></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="tools">
      <button class="btn" id="theme-btn" type="button">Theme: Auto</button>
      <button class="btn" id="export-btn" type="button">Export progress</button>
      <label class="btn" for="import-file">Import progress</label>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="btn danger" id="reset-btn" type="button">Reset</button>
    </div>
    <div class="confirm" id="reset-confirm" hidden>
      <span>Clear every checkbox?</span>
      <button class="btn danger" id="reset-yes" type="button">Clear all</button>
      <button class="btn" id="reset-no" type="button">Keep</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="player" aria-label="Video player">
  <div class="dhead"><strong id="player-title"></strong><span class="tools"><a class="btn" id="player-yt" target="_blank" rel="noopener">Open on YouTube</a><button class="btn" id="player-close" type="button">Close</button></span></div>
  <div id="player-frame"></div>
</dialog>

s, large for ambience"], ["Diffusion / density", "Smoothness of the tail", "High for pads, lower for rhythmic clarity"], ["Input / low cut", "Removes low end before the reverb", "200–400 Hz to avoid mud"], ["High damping", "Darkens the tail", "Around 4–8 kHz for a natural sound"], ["Dry/Wet", "Balance of effect", "100% wet on a return track"]]}, {"t": "p", "html": "Rhythmic pre-delay: one beat in milliseconds is 60,000 ÷ BPM. At 120 BPM a beat is 500 ms, a 1/8 note 250 ms and a 1/16 note 125 ms; set pre-delay to a 1/16 or 1/32 value so the tail breathes in time."}, {"t": "label", "html": "Practise"}, {"t": "tasks", "items": [{"id": "t-57f6259c", "html": "Create two returns: A = short room, B = long hall; feed drums to A and pads/lead to B"}, {"id": "t-eed19e34", "html": "Automate the B send up at the end of a phrase for a reverb \"throw\""}, {"id": "t-bc61ebf4", "html": "Compare a 0 ms and a 1/16-note pre-delay on the snare and note what changes"}]}]}, {"id": "week-8", "title": "Week 8 · Review and deliverable", "week": 8, "blocks": [{"t": "tasks", "items": [{"id": "t-51857b45", "html": "Complete a 2–3 minute arrangement draft with at least 3 automated effect parameters"}, {"id": "t-95dc2aed", "html": "Export it to Exports / L2 and compare it with your reference track at matched volume"}]}]}]}, {"id": "level-3", "title": "Level 3 · Weeks 9–13 · Creating a Track", "kind": "level", "blocks": [{"t": "p", "html": "Goal: by the end of Week 13 you have your first finished, mixed and exported track, started from scratch in this level."}], "subs": [{"id": "week-9", "title": "Week 9 · Lesson 7: Core effects and the stereo field", "week": 9, "blocks": [{"t": "label", "html": "Study"}, {"t": "list", "ordered": false, "items": ["<a href=\"https://www.ableton.com/en/live-manual/12/live-audio-effect-reference/#phaser-flanger\" target=\"_blank\" rel=\"noopener\">Phaser-Flanger<\/a>, <a href=\"https://www.ableton.com/en/live-manual/12/live-audio-effect-reference/#chorus-ensemble\" ths.ableton.com/\" target=\"_blank\" rel=\"noopener\">Learning Synths: LFO and envelope lessons<\/a>"]}, {"t": "label", "html": "Watch"}, {"t": "videos", "items": [{"id": "v-0aef70bc", "vid": "7qQX6YGBQEA", "title": "Free Vital Synth – Full Tutorial", "meta": "In The Mix (30 min)"}, {"id": "v-1467e850", "vid": "49B7VsxDVVI", "title": "Meet Vital: The Incredible New Free Synth Plugin – 10 Ways to Use Vital", "meta": "Venus Theory (21 min)"}, {"id": "v-dfdc26e4", "vid": "z58IaacCLhk", "title": "Vital Synth: The Last Guide You'll Ever Need", "meta": "EDMProd (19 min, oscillators, filters, LFOs)"}, {"id": "v-fbd58a36", "vid": "Gu44gDmhAzg", "title": "Introducing Omnisphere 3", "meta": "Spectrasonics (31 min); for depth, the paid <a href=\"https://www.musehub.com/course/g3-course-omnisphere-3-explained\" target=\"_blank\" rel=\"noopener\">Omnisphere 3 Explained<\/a> course by Eli Krantzberg"}]}, {"t": "label", "html": "Resonance Music Academy"}, {"t": "videos", "items": [{"id": "v-39a69454", "vid": "Mp8J25VZy-g", "title": "Создаём свой уникальный бас для хип-хопа, трэпа, дабстепа", "meta": "Resonance Music Academy (18 min, Russian)"}, {"id": "v-4754e54a", "vid": "myuHzrQqcFI", "title": "Rolling bass для техно-трека за 16 минут", "meta": "Resonance Music Academy (16 min, Russian)"}, {"id": "v-4014c99a", "vid": "A7qs0yuzyCE", "title": "5 заблуждений о басе", "meta": "Resonance Music Academy (18 min, Russian)"}]}, {"t": "label", "html": "Practise"}, {"t": "tasks", "items": [{"id": "t-65e34b89", "html": "In Vital, build a wobble bass with an LFO synced to 1/8 on filter cutoff"}, {"id": "t-26777b18", "html": "Use a mod envelope on pitch for a laser/zap FX and on filter for a plucky lead"}, {"id": "t-dccc6d1e", "html": "Layer an Omnisphere (or Wavetable) pad under a Vital lead and EQ them so they don't clash"}, {"id": "t-e0a84e75", "html": "Save every patch you like into Presets / L4"}]}]}, {"id": "week-17", "title": "Week 17 · Review and deliverable", "week": 17, "blocks": [{ hange and EQ them out of the vocal's way"}, {"id": "t-93fd7867", "html": "Revisit the drum section: tighten kick and bass with sidechain compression and finalise the groove"}]}]}, {"id": "week-21", "title": "Week 21 · Final project", "week": 21, "blocks": [{"t": "tasks", "items": [{"id": "t-8b837e42", "html": "Finish Track 4 with a full vocal chain, transitions and a mastered export (Limiter, −1 dB ceiling)"}, {"id": "t-81175af2", "html": "Export to Exports / L5 and play all 5 level exports in order to hear your progress"}]}]}]}, {"id": "progress-tracker-and-resources", "title": "Progress tracker and resources", "kind": "resources", "blocks": [{"t": "label", "html": "General resources"}, {"t": "list", "ordered": false, "items": ["<a href=\"https://www.ableton.com/en/live-manual/12/welcome-to-live/\" target=\"_blank\" rel=\"noopener\">Ableton Live 12 Reference Manual<\/a> and its <a href=\"https://cdn-resources.ableton.com/resources/pdfs/live-manual/12/2026-10-01/live12-manual-en.pdf\" target=\"_blank\" rel=\"noopener\">PDF version<\/a> for offline reading", "<a href=\"https://learn.ableton.com/\" target=\"_blank\" rel=\"noopener\">Ableton Learn<\/a>, <a href=\"https://learningmusic.ableton.com/\" target=\"_blank\" rel=\"noopener\">Learning Music<\/a>, <a href=\"https://learningsynths.ableton.com/\" target=\"_blank\" rel=\"noopener\">Learning Synths<\/a>", "<a href=\"https://makingmusic.ableton.com/\" target=\"_blank\" rel=\"noopener\">Making Music<\/a>: creative strategies for when you're stuck", "<a href=\"https://www.ableton.com/en/packs/\" target=\"_blank\" rel=\"noopener\">Ableton Packs<\/a>: includes free packs for your sample library", "<a href=\"http://youtube.com/ableton\" target=\"_blank\" rel=\"noopener\">Ableton on YouTube<\/a> for tutorials and artist walkthroughs", "<a href=\"https://discord.com/invite/ableton\" target=\"_blank\" rel=\"noopener\">Ableton Discord<\/a> for feedback on your exports", "<a href=\"https://www.ableton.com/en/trial/\" target=\"_blank\" rel=\"noopener\">Live 12 free trial<\/a>"]}], "subs": [], "tracker": [{"level": "1 · Introduction", "weeks": "1–4", "deliverable": "8-bar Session sketch, 4 scenes", "due": "Dec 6, 2026"}, {"level": "2 · Mastering the Software", "weeks": "5–8", "deliverable": "2–3 min arrangement draft", "due": "Jan 3, 2027"}, {"level": "3 · Creating a Track", "weeks": "9–13", "deliverable": "Track 1, mixed and exported", "due": "Feb 7, 2027"}, {"level": "4 · Sound Design", "weeks": "14–17", "deliverable": "Tracks 2 and 3 sketches, 10+ presets", "due": "Mar 7, 2027"}, {"level": "5 · Composition and Vocals", "weeks": "18–21", "deliverable": "Track 4 with vocals, mastered", "due": "Apr 4, 2027"}]}, {"id": "appendix-creating-uk-garage-and-uk-bass", "title": "Appendix · Creating UK garage and UK bass", "kind": "appendix", "blocks": [{"t": "p", "html": "UK garage runs at 130–138 BPM on swung 16th-note hats, a broken \"2-step\" kick, chopped vocals and jungle-derived bass; \"UK bass\" is the wider family it fed, from bassline and grime to dubstep, UK funky and today's bass-led club records. Start this appendix after Level 3 (you need warping, MIDI effects and a finished mix) and run it as a 4-week project, Weeks 22–25, or alongside Level 4."}], "subs": [{"id": "appendix-creating-uk-garage-and-uk-bass-the-family-at-a-glance", "title": "The family at a glance", "week": null, "blocks": [{"t": "table", "head": ["Style", "BPM", "Drums", "Bass and feel", "Reference"], "rows": [["Speed garage", "130–138", "Four-to-the-floor kick cut with breakbeat fragments", "Heavy jungle-style bass under house vocals", "Double 99, \"RipGroove\" (1997)"], ["2-step", "130–135", "Kick on beat 1 and halfway through beat 3, clap on 2 and 4, swung 16th hats", "Sub answering the kick, R&amp;B vocals", "Artful Dodger ft. Craig David, \"Re-Rewind\" (1999); MJ Cole, \"Sincere\""], ["4x4 garage", "130–138", "Straight house kick with garage swing", "Chopped vocals on top", "Todd Edwards productions"], ["Bassline", "135–142", "Four-to-the-floor", "Bass carries the melody", "T2 ft. Jodie Aysha, \"Heartbroken\" (2007)"], ["Grime", "about 140", "Sparse, hard, MC-led", "Heavy sub, cold square-wave synths", "Wiley's \"eskibeat\" instrumentals"], ["Dubstep", "140, half-time feel", "Grew from dark 2-step", "Dubbed-out sub weight", "El-B, Horsepower Productions"], ["Modern UKG / UK bass", "132–138", "2-step and 4x4 switching inside one track", "FM, reese and organ basses, pitched vocal chops", "Eliza Rose &amp; Interplanetary Criminal, \"B.O.T.A.\" (2022); Sammy Virji &amp; Interplanetary Criminal, \"Damager\" (2024)"]]}, {"t": "p", "html": "Tempo guide: 130–132 BPM for classic 2-step (below 128 the shuffle drags), around 136 for modern UKG, 138–140 for speed garage and bassline energy."}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-the-2-step-drum-pattern", "title": "The 2-step drum pattern", "week": null, "blocks": [{"t": "p", "html": "One bar in 16th notes (1 = beat 1, 5 = beat 2, 9 = beat 3, 13 = beat 4). x = hit, (x) = optional variation. Program it in a Drum Rack, then copy and vary bar 2."}, {"t": "grid", "rows": [["Kick", "x", "", "", "", "", "", "", "(x)", "", "", "x", "", "", "", "", ""], ["Clap / snare", "", "", "", "", "x", "", "", "", "", "", "", "", "x", "", "", ""], ["Closed hat", "", "x", "", "x", "", "x", "", "x", "", "x", "", "x", "", "x", "", "x"], ["Open hat", "", "", "x", "", "", "", "x", "", "", "", "x", "", "", "", "x", ""], ["Rim / perc", "", "", "", "(x)", "", "", "", "", "", "x", "", "", "", "(x)", "", ""]]}, {"t": "label", "html": "How to make it swing in Live"}, {"t": "list", "ordered": true, "items": ["Set the tempo to 130–132 and program the grid above with velocities: claps 100%, closed hats alternating 60–80%, ghost rims 40–60%.", "Drag a 16th-note swing groove from the Groove Pool (an MPC 16 Swing groove around 66–70%) onto the hats and percussion; keep kick and clap straight or lightly swung.", "Nudge a few hats late by hand with the grid off. Garage swing lives in individual hits, not one global setting.", "Keep percussion sparse: 2–4 extra hits per bar. The gaps are the groove.", "Put tape-style saturation (Saturator or Roar) on the drum group and roll off a little top end for the old-school feel."]}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-bass-recipes-with-live-s-own-instruments", "title": "Bass recipes with Live's own instruments", "week": null, "blocks": [{"t": "table", "head": ["Bass", "Build it with", "Steps"], "rows": [["Organ bass (classic 2-step)", "Operator or Wavetable + a sine sub", "Square or organ-style wave, ring modulation or a second organ layer moved by an envelope, resonant low-pass on the envelope, a touch of drive; layer a pure sine two octaves down on its own track. The Korg M1 \"Organ 2\" sound is the classic reference."], ["Reese (speed garage, future garage)", "Wavetable or Drift", "Two saws detuned against each other, low-pass filter, slow LFO on filter or wavetable position, chorus for width; mono the sub below about 120 Hz."], ["FM drop bass (modern UKG)", "Wavetable (FM table)", "Design it on the note you will actually use; automate a resonant low-pass to find the sweet spot; stack a second FM layer; glue with upward multiband compression; add distortion, then Redux or Erosion for grit; resample the result."], ["Bassline wobble", "Wavetable or Operator", "The bass plays the hook: write a melodic line, then move filter cutoff with an LFO synced to 1/8 or 1/16 and automate the rate between phrases."]]}, {"t": "p", "html": "Sidechain the bass and the chord pad to the kick with the same ducking so they move together."}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-vocal-chops-chords-and-fx", "title": "Vocal chops, chords and FX", "week": null, "blocks": [{"t": "tasks", "items": [{"id": "t-265bddc1", "html": "Chop an a cappella into fragments too short to be words with Simpler in Slicing mode, then play the slices as a new melodic riff (the Todd Edwards approach)"}, {"id": "t-f1911fe7", "html": "Keep some artifacts: pitch chops up with Re-Pitch, or add Redux bit-reduction to imitate 12-bit hardware samplers such as the Akai S950"}, {"id": "t-aa4d6a65", "html": "Put a 1/8 or 1/16 delay on the chops for call-and-response bounce"}, {"id": "t-adc1eaac", "html": "For the \"radio\" vocal, band-pass it with EQ Eight and send it to a long reverb so it sits behind the drums"}, {"id": "t-e757847d", "html": "Write chord stabs as minor 7ths and 9ths with a short organ or piano patch, and chop a pad rhythmically"}, {"id": "t-e7337dc5", "html": "Make a riser by putting Auto Pan on white noise at a fast rate, and gate ambience to the drum group with a sidechained Gate"}]}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-arrangement-template-dj-friendly", "title": "Arrangement template (DJ-friendly)", "week": null, "blocks": [{"t": "table", "head": ["Section", "Bars", "What happens"], "rows": [["Intro", "16", "Drums only or drums plus filtered pad, so DJs can mix in"], ["Build", "16", "Vocal tease, hats open up, filter sweep on the pad, noise riser in the last 4 bars"], ["Drop 1", "32", "Main bass, full 2-step drums, vocal chops"], ["Break", "16", "Pad, full vocal line, breakbeat as a transition"], ["Drop 2", "32", "Switch to 4x4 or a second bass, add a pluck or arp for lift"], ["Outro", "16", "Strip back to drums for the mix-out"]]}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-4-week-mini-project", "title": "4-week mini project", "week": null, "blocks": [{"t": "label", "html": "Week A · Groove"}, {"t": "tasks", "items": [{"id": "t-82f9acdf", "html": "Program the 2-step pattern above and a 4x4 version at 132 BPM; export both as 8-bar loops"}, {"id": "t-7e74c239", "html": "Compare your swing against 2 reference tracks from the listening list at matched volume"}]}, {"t": "label", "html": "Week B · Bass"}, {"t": "tasks", "items": [{"id": "t-8fe139ac", "html": "Build the organ bass, a reese and an FM drop bass; save each as an Instrument Rack with 4 Macros"}, {"id": "t-3b63574e", "html": "Write a 4-bar bassline that answers the kick instead of doubling it"}]}, {"t": "label", "html": "Week C · Chops and harmony"}, {"t": "tasks", "items": [{"id": "t-4b4975bc", "html": "Make a vocal-chop riff and a chord-stab progression; tune the chops to the key"}, {"id": "t-5d26ad49", "html": "Resample your favourite bass and chop it into a new rhythmic part"}]}, {"t": "label", "html": "Week D · Arrange and finish"}, {"t": "tasks", "items": [{"id": "t-91f2dd6b", "html": "Arrange a 3–4 minute track using the template above"}, {"id": "t-c1185188", "html": "Mix with your Level 3 checklist, master to a −1 dB ceiling, export to Exports / UKG"}]}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-listening-list", "title": "Listening list", "week": null, "blocks": [{"t": "table", "head": ["Track", "Artist", "Branch", "Listen for"], "rows": [["<a href=\"https://www.youtube.com/watch?v=iR2tIyj8_y8\" target=\"_blank\" rel=\"noopener\" data-yt=\"iR2tIyj8_y8\">Flowers<\/a>", "Sweet Female Attitude", "2-step", "The prototypical shuffle and R&amp;B vocal chops"], ["<a href=\"https://www.youtube.com/watch?v=M0wv_cQv8As\" target=\"_blank\" rel=\"noopener\" data-yt=\"M0wv_cQv8As\">Re-Rewind<\/a>", "Artful Dodger ft. Craig David", "2-step", "A full song over a 2-step beat"], ["<a href=\"https://www.youtube.com/watch?v=DXCtYUtjDYU\" target=\"_blank\" rel=\"noopener\" data-yt=\"DXCtYUtjDYU\">Sincere<\/a>", "MJ Cole", "2-step", "Jazzy chords and tight swing"], ["<a href=\"https://www.youtube.com/watch?v=uR3Vw8J8vUo\" target=\"_blank\" rel=\"noopener\" data-yt=\"uR3Vw8J8vUo\">RipGroove<\/a>", "Double 99", "Speed garage", "Jungle bass under a house groove"], ["<a href=\"https://www.youtube.com/watch?v=OQCQnARnKbc\" target=\"_blank\" rel=\"noopener\" data-yt=\"OQCQnARnKbc\">Sweet Like Chocolate<\/a>", "Shanks &amp; Bigfoot", "2-step", "The first UK garage UK No. 1 (1999)"], ["<a href=\"https://www.youtube.com/watch?v=g7VhofoV3qs\" target=\"_blank\" rel=\"noopener\" data-yt=\"g7VhofoV3qs\">21 Seconds<\/a>", "So Solid Crew", "MC garage", "The move towards grime"], ["<a href=\"https://www.youtube.com/watch?v=w_Chrqwt-Hk\" target=\"_blank\" rel=\"noopener\" data-yt=\"w_Chrqwt-Hk\">Heartbroken<\/a>", "T2 ft. Jodie Aysha", "Bassline", "A bass that carries the hook"], ["<a href=\"https://www.youtube.com/watch?v=r_Q40kOt9X0\" target=\"_blank\" rel=\"noopener\" data-yt=\"r_Q40kOt9X0\">Ladbroke Grove<\/a>", "AJ Tracey (prod. Conducta)", "Modern UKG", "A rapper over a classic garage beat"], ["<a href=\"https://www.youtube.com/watch?v=KtGFByAJRQQ\" target=\"_blank\" rel=\"noopener\" data-yt=\"KtGFByAJRQQ\">B.O.T.A. (Baddest of Them All)<\/a>", "Eliza Rose &amp; Interplanetary Criminal", "Modern UKG", "2022 UK No. 1 built on organ bass and swing"], ["<a href=\"https://www.youtube.com/watch?v=KJYdvYZG4rs\" target=\"_blank\" rel=\"noopener\" data-yt=\"KJYdvYZG4rs\">U Belong 2 Me<\/a>", "Y U QT", "Modern UKG", "Punchy contemporary drums"], ["<a href=\"https://www.youtube.com/watch?v=uYhd4NIYTV0\" target=\"_blank\" rel=\"noopener\" data-yt=\"uYhd4NIYTV0\">Damager<\/a>", "Sammy Virji &amp; Interplanetary Criminal", "Modern UK bass", "Chopped pads and FM bass at about 136 BPM"]]}]}, {"id": "appendix-creating-uk-garage-and-uk-bass-watch-and-read", "title": "Watch and read", "week": null, "blocks": [{"t": "label", "html": "Resonance Music Academy"}, {"t": "videos", "items": [{"id": "v-525ef067", "vid": "Jkkff3WRcbo", "title": "Пишем UK House в Ableton – PROSPA, PAWSA, Josh Baker", "meta": "Resonance Music Academy (26 min, Russian; UK house, a close relative of UKG)"}, {"id": "v-694801c1", "vid": "RO1_Gw_fmHk", "title": "Как написать бас? 10 паттернов для разных стилей", "meta": "Resonance Music Academy (14 min, Russian)"}]}, {"t": "label", "html": "Other videos and articles"}, {"t": "videos", "items": [{"id": "v-204fd5e5", "vid": "LhEuh8qs0Ro", "title": "How To Make UK Garage In 1 Hour (Ableton Tutorial)", "meta": "The Producer School (51 min; <a href=\"https://theproducerschool.com/blogs/featured-blogs/how-to-make-uk-garage-in-1-hour-complete-ableton-tutorial\" target=\"_blank\" rel=\"noopener\">written breakdown<\/a>)"}, {"id": "v-c4865706", "vid": "dxjahBL73sE", "title": "How To Make UK Garage (like Sammy Virji &amp; Interplanetary Criminal)", "meta": "The Producer School (17 min)"}, {"id": "v-1c40ac62", "vid": "K89qMKNyxQM", "title": "Style Guide: UK Garage | Part 1 – A History of UK Garage with MJ Cole", "meta": "Point Blank Music School (23 min)"}, {"id": "v-02cfd41d", "vid": "K7jANHlDrFE", "title": "Style Guide: UK Garage | Part 2 – Making a Track on the Fly with MJ Cole", "meta": "Point Blank Music School (32 min)"}, {"id": "v-e6798cb1", "vid": "5rEh2eYB8gY", "title": "How To Make Old School 2-Step UK Garage (like El-B, Groove Chronicles)", "meta": "Studio Orbit (27 min)"}, {"id": "v-bd689b02", "vid": "mLpEumblv4g", "title": "The Basics of UK Garage – Ableton Tutorial for Beginners", "meta": "STRANJAH (18 min)"}, {"id": "v-699ca86d", "vid": "S2tZsjo4GxE", "title": "UK Garage 101: Your Guide to the Top Drum Patterns", "meta": "STRANJAH (17 min)"}, {"id": "v-dd35c16d", "vid": "1ccGmLoQWfw", "title": "How To Make Modern UK Garage – Pad and Chord Progression", "meta": "Sonic Academy with P-LASK (14 min)"}, {"id": "v-07753894", "vid": "p2odAAis2go", "title": "The Only UK Garage Reese Bass Video You'll Need", "meta": "The Producer School (13 min; Serum 2, the same steps work in Wavetable or Vital)"}, {"id": "v-56d4d554", "vid": "D-6uCodTKu0", "title": "How To Make Speed Garage (like Interplanetary Criminal)", "meta": "The Producer School (15 min)"}, {"id": "v-0d5b933a", "vid": "ZGclAwFu78Q", "title": "Make Overmono Type Bass With Drift", "meta": "Attack Magazine (8 min, UK bass in Ableton)"}]}, {"t": "list", "ordered": false, "items": ["<a href=\"https://www.musicradar.com/how-to/uk-garage-tutorial\" target=\"_blank\" rel=\"noopener\">How to make a UK garage beat<\/a> — MusicRadar article (drums, organ bass, vocal chops)", "<a href=\"https://www.native-instruments.com/blogs/blog/uk-garage-music\" target=\"_blank\" rel=\"noopener\">Everything you need to know about UK garage, and how to make it<\/a> — Native Instruments article", "<a href=\"https://www.attackmagazine.com/technique/beat-dissected/uk-garage/\" target=\"_blank\" rel=\"noopener\">Beat Dissected: UK garage<\/a> — Attack Magazine article"]}, {"t": "p", "html": "Sources for this appendix: <a href=\"https://orphiq.com/resources/what-is-uk-garage\" target=\"_blank\" rel=\"noopener\">What Is UK Garage? (Orphiq)<\/a>, <a href=\"https://www.musicradar.com/how-to/uk-garage-tutorial\" target=\"_blank\" rel=\"noopener\">How to make a UK garage beat (MusicRadar)<\/a>, <a href=\"https://theproducerschool.com/blogs/featured-blogs/how-to-make-uk-garage-in-1-hour-complete-ableton-tutorial\" target=\"_blank\" rel=\"noopener\">How to Make UK Garage in 1 Hour (The Producer School)<\/a>, <a href=\"https://en.wikipedia.org/wiki/UK_garage\" target=\"_blank\" rel=\"noopener\">UK garage (Wikipedia)<\/a>."}]}]}];
const START = new Date(2026, 10, 9);
const KEY = "ableton-plan-v1";
const LEVEL_COLOR = { "level-1": "var(--l1)", "level-2": "var(--l2)", "level-3": "var(--l3)", "level-4": "var(--l4)", "level-5": "var(--l5)" };
const colorOf = s => LEVEL_COLOR[s.id] || (s.kind === "appendix" ? "var(--l6)" : "var(--muted)");

let state = { done: {}, open: {}, theme: "auto" };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const blocksOf = s => [s.blocks].concat(s.subs.map(x => x.blocks));
function idsIn(blocks) { const t = [], v = []; blocks.forEach(b => { if (b.t === "tasks") b.items.forEach(i => t.push(i.id)); if (b.t === "videos") b.items.forEach(i => v.push(i.id)); }); return { t, v }; }
function tally(ids) { const all = ids.t.concat(ids.v); const n = all.filter(id => state.done[id]).length; return { n, total: all.length, pct: all.length ? Math.round(n / all.length * 100) : 0 }; }

function currentWeek() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.floor((today - START) / 86400000);
  return days < 0 ? { before: true, days: -days } : { week: Math.floor(days / 7) + 1 };
}

function renderBlock(b, c) {
  switch (b.t) {
    case "p": return `<p>${b.html}</p>`;
    case "label": return `<div class="label">${b.html}</div>`;
    case "list": return b.ordered ? `<ol class="steps">${b.items.map(i => `<li>${i}</li>`).join("")}</ol>` : `<ul class="links">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    case "tasks": return `<ul class="tasks">${b.items.map(i => `<li><label><input type="checkbox" data-id="${i.id}"${state.done[i.id] ? " checked" : ""}><span>${i.html}</span></label></li>`).join("")}</ul>`;
    case "videos": return `<div class="videos">${b.items.map(v => `
      <article class="video${state.done[v.id] ? " watched" : ""}" data-card="${v.id}">
        <button class="thumb" type="button" data-play="${v.vid}" aria-label="Play ${esc(v.title)}">
          <img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.vid}/mqdefault.jpg" onerror="var p=this.parentNode;this.remove();p.classList.add('fallback')"><span class="play"></span>
        </button>
        <div class="vinfo"><div class="vt">${v.title}</div><div class="vm">${v.meta}</div>
          <div class="vrow"><label><input type="checkbox" data-id="${v.id}"${state.done[v.id] ? " checked" : ""}> Watched</label>
          <a href="https://www.youtube.com/watch?v=${v.vid}" target="_blank" rel="noopener">Open on YouTube</a></div></div>
      </article>`).join("")}</div>`;
    case "table": return `<div class="table-wrap"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "grid": {
      const head = `<tr><th></th>${Array.from({ length: 16 }, (_, i) => `<th class="${i % 4 === 0 ? "beat" : ""}">${i + 1}</th>`).join("")}</tr>`;
      const rows = b.rows.map(r => `<tr><td class="name">${esc(r[0])}</td>${r.slice(1).map((x, i) => `<td><span class="pad${i % 4 === 0 ? " beatcol" : ""}${x === "x" ? " on" : x === "(x)" ? " opt" : ""}" title="Step ${i + 1}${x ? (x === "x" ? ": hit" : ": optional") : ""}"></span></td>`).join("")}</tr>`).join("");
      return `<div class="table-wrap" style="padding:10px"><table class="grid16">${head}${rows}</table></div><div class="legend"><span><span class="pad on"></span>hit</span><span><span class="pad opt"></span>optional variation</span><span>Steps 1, 5, 9, 13 are the four beats</span></div>`;
    }
  }
  return "";
}

function weekCard(s, sub) {
  const c = colorOf(s), ids = idsIn(sub.blocks), t = tally(ids);
  if (!ids.t.length && !ids.v.length) return `<div class="appendix-sub" id="${sub.id}"><h3 class="sub-head">${esc(sub.title)}</h3><div class="prose" style="max-width:none">${sub.blocks.map(b => renderBlock(b, c)).join("")}</div></div>`;
  const open = sub.id in state.open ? state.open[sub.id] : t.n < t.total;
  const label = sub.week ? `W${sub.week}` : "UKG";
  const title = sub.title.replace(/^Week \d+ · /, "");
  return `<details class="week${t.n === t.total ? " complete" : ""}" id="${sub.id}" data-sub="${sub.id}"${open ? " open" : ""} style="--c:${c}">
    <summary><span class="wk">${label}</span><h3>${esc(title)}</h3><span class="count"><span class="bar"><i data-bar="${sub.id}" style="--c:${c}"></i></span><span data-count="${sub.id}"></span><span class="caret"></span></span></summary>
    <div class="body">${sub.blocks.map(b => renderBlock(b, c)).join("")}</div></details>`;
}

function trackerTable(s) {
  return `<div class="table-wrap"><table><thead><tr><th>Level</th><th>Weeks</th><th>Deliverable</th><th>Due</th><th>Progress</th></tr></thead><tbody>${s.tracker.map((r, i) => `
    <tr><td><span class="chip clip" style="--c:var(--l${i + 1})">${esc(r.level)}</span></td><td class="mono">${esc(r.weeks)}</td><td>${esc(r.deliverable)}</td><td class="mono">${esc(r.due)}</td><td><span class="status" data-status="level-${i + 1}"></span></td></tr>`).join("")}</tbody></table></div>`;
}

function render() {
  const main = document.getElementById("main");
  const cw = currentWeek();
  let nowHtml = "";
  if (cw.before) nowHtml = `<div class="now-card"><div><div class="eyebrow">Before you start</div><h2>Week 1 begins in ${cw.days} day${cw.days === 1 ? "" : "s"}. Do the setup checklist first.</h2></div><button type="button" data-jump="how-to-use-this-plan">Open setup checklist</button></div>`;
  else if (cw.week <= 21) {
    const sub = DATA.flatMap(s => s.subs).find(x => x.week === cw.week);
    if (sub) nowHtml = `<div class="now-card"><div><div class="eyebrow">This week · Week ${cw.week} of 21</div><h2>${esc(sub.title.replace(/^Week \d+ · /, ""))}</h2></div><button type="button" data-jump="${sub.id}">Go to this week</button></div>`;
  } else nowHtml = `<div class="now-card"><div><div class="eyebrow">Course schedule finished</div><h2>Time for the UK garage and UK bass project.</h2></div><button type="button" data-jump="appendix-creating-uk-garage-and-uk-bass">Open the appendix</button></div>`;

  main.innerHTML = nowHtml + DATA.map(s => {
    const c = colorOf(s), ids = idsIn([].concat(...blocksOf(s)));
    const head = `<div class="sec-head"><h2>${esc(s.title)}</h2>${(ids.t.length || ids.v.length) ? `<div class="meta"><span class="chip clip" style="--c:${c}" data-secchip="${s.id}"></span><span class="bar"><i data-bar="${s.id}" style="--c:${c}"></i></span></div>` : ""}</div>`;
    const intro = s.blocks.length ? `<div class="prose">${s.blocks.map(b => renderBlock(b, c)).join("")}</div>` : "";
    const tracker = s.tracker ? trackerTable(s) : "";
    const subs = s.subs.map(x => weekCard(s, x)).join("");
    return `<section class="block" id="${s.id}" style="--c:${c}">${head}${tracker}${intro}${subs}</section>`;
  }).join("") + `<footer>Progress is saved in this browser only. Use Export progress to back it up or move it to another computer. Videos play inside the page; if a player shows an error (YouTube sometimes refuses to play in pages opened straight from a file), use Open on YouTube.</footer>`;

  document.getElementById("nav").innerHTML = DATA.map(s => {
    const short = s.title.replace(/ · Weeks.*$/, "").replace(/^Appendix · Creating /, "Appendix: ").replace(/^Progress tracker and resources$/, "Tracker & resources");
    const label = s.kind === "level" ? `${short} · ${s.title.split(" · ").pop()}` : short;
    return `<a href="#${s.id}" style="--c:${colorOf(s)}"><span class="dot"></span><span>${esc(label)}</span><span class="pct" data-navpct="${s.id}"></span></a>`;
  }).join("");

  const cols = DATA.filter(s => s.kind === "level" || s.kind === "appendix");
  document.getElementById("session").innerHTML = cols.map(s => {
    const slots = s.subs.filter(x => { const i = idsIn(x.blocks); return i.t.length || i.v.length; });
    const head = s.kind === "level" ? `L${s.id.slice(-1)}` : "UKG";
    return `<div class="col" style="--c:${colorOf(s)}"><div class="head">${head}</div>${slots.map((x, k) => `<button class="slot${x.week === cw.week ? " now" : ""}" type="button" data-jump="${x.id}" data-slot="${x.id}" title="${esc(x.title)}"><i></i><span>${x.week || "A" + (k + 1)}</span></button>`).join("")}</div>`;
  }).join("");
  updateProgress();
}

function updateProgress() {
  const counted = DATA.filter(s => s.kind === "level" || s.kind === "intro");
  const allIds = { t: [], v: [] };
  counted.forEach(s => { const i = idsIn([].concat(...blocksOf(s))); allIds.t.push(...i.t); allIds.v.push(...i.v); });
  const o = tally(allIds);
  document.getElementById("ov-pct").textContent = o.pct + "%";
  document.getElementById("ov-count").textContent = `${o.n} / ${o.total} done`;
  document.getElementById("ov-bar").style.width = o.pct + "%";
  const vw = allIds.v.filter(id => state.done[id]).length;
  document.getElementById("ov-videos").textContent = `${vw} of ${allIds.v.length} videos watched · UK garage appendix counted separately`;

  DATA.forEach(s => {
    const t = tally(idsIn([].concat(...blocksOf(s))));
    document.querySelectorAll(`[data-bar="${s.id}"]`).forEach(el => el.style.width = t.pct + "%");
    const chip = document.querySelector(`[data-secchip="${s.id}"]`); if (chip) chip.textContent = `${t.n}/${t.total} · ${t.pct}%`;
    const np = document.querySelector(`[data-navpct="${s.id}"]`); if (np) np.textContent = t.total ? t.pct + "%" : "";
    const st = document.querySelector(`[data-status="${s.id}"]`);
    if (st) { const k = t.n === 0 ? 0 : t.n === t.total ? 2 : 1; st.className = "status s" + k; st.textContent = ["Not started", `In progress · ${t.pct}%`, "Done"][k]; }
    s.subs.forEach(x => {
      const xt = tally(idsIn(x.blocks)); if (!xt.total) return;
      const bar = document.querySelector(`[data-bar="${x.id}"]`); if (bar) bar.style.width = xt.pct + "%";
      const cnt = document.querySelector(`[data-count="${x.id}"]`); if (cnt) cnt.textContent = `${xt.n}/${xt.total}`;
      const card = document.getElementById(x.id); if (card) card.classList.toggle("complete", xt.n === xt.total);
      const slot = document.querySelector(`[data-slot="${x.id}"]`);
      if (slot) { slot.firstElementChild.style.width = xt.pct + "%"; slot.classList.toggle("full", xt.pct === 100); slot.title = `${x.title} · ${xt.n}/${xt.total}`; }
    });
  });
}

function jump(id) {
  const el = document.getElementById(id); if (!el) return;
  if (el.tagName === "DETAILS") el.open = true;
  el.scrollIntoView({ block: "start" });
}

document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  if (e.target.checked) state.done[id] = Date.now(); else delete state.done[id];
  const card = document.querySelector(`[data-card="${id}"]`); if (card) card.classList.toggle("watched", e.target.checked);
  save(); updateProgress();
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.sub) return;
  state.open[d.dataset.sub] = d.open; save();
}, true);
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); jump(j.dataset.jump); return; }
  const p = e.target.closest("[data-play]");
  if (p) {
    const card = p.closest(".video");
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${p.dataset.play}?autoplay=1&rel=0`;
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    f.allowFullscreen = true; f.referrerPolicy = "strict-origin-when-cross-origin"; f.title = card.querySelector(".vt").textContent;
    p.replaceWith(f); card.classList.add("playing");
    card.scrollIntoView({ block: "nearest" });
    return;
  }
  const a = e.target.closest("a[data-yt]");
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); openPlayer(a.dataset.yt, a.textContent); }
});

const dlg = document.getElementById("player");
function openPlayer(vid, title) {
  document.getElementById("player-title").textContent = title;
  document.getElementById("player-yt").href = `https://www.youtube.com/watch?v=${vid}`;
  document.getElementById("player-frame").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  if (dlg.showModal) dlg.showModal(); else window.open(`https://www.youtube.com/watch?v=${vid}`, "_blank");
}
function closePlayer() { document.getElementById("player-frame").innerHTML = ""; if (dlg.open) dlg.close(); }
document.getElementById("player-close").onclick = closePlayer;
dlg.addEventListener("close", () => { document.getElementById("player-frame").innerHTML = ""; });
dlg.addEventListener("click", e => { if (e.target === dlg) closePlayer(); });

const themeBtn = document.getElementById("theme-btn");
function applyTheme() {
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", state.theme);
  themeBtn.textContent = "Theme: " + { auto: "Auto", light: "Light", dark: "Dark" }[state.theme];
}
themeBtn.onclick = () => { state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme] || "auto"; applyTheme(); save(); };

const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; clearTimeout(toast.h); toast.h = setTimeout(() => t.textContent = "", 3500); };
document.getElementById("export-btn").onclick = () => {
  const blob = new Blob([JSON.stringify({ app: KEY, exported: new Date().toISOString(), done: state.done }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ableton-plan-progress.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Progress exported");
};
document.getElementById("import-file").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const d = JSON.parse(txt); if (!d || typeof d.done !== "object") throw new Error();
    Object.assign(state.done, d.done); save(); render(); toast(`Imported ${Object.keys(d.done).length} completed items`);
  }).catch(() => toast("That file isn't a progress export from this page")).finally(() => { e.target.value = ""; });
};
const rc = document.getElementById("reset-confirm");
document.getElementById("reset-btn").onclick = () => { rc.hidden = false; };
document.getElementById("reset-no").onclick = () => { rc.hidden = true; };
document.getElementById("reset-yes").onclick = () => { state.done = {}; state.open = {}; save(); rc.hidden = true; render(); toast("All checkboxes cleared"); };

applyTheme();
render();
</script>
</body>
</html>
